name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy Pillow pytest ruff torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest --rootdir=tests --confcutdir=tests tests --import-mode=importlib -q
      - run: python -m ruff check . --select S102,S307,E702
